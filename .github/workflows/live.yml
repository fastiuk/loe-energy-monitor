name: LOE API

# Daily check that the undocumented LOE API still answers in the format we parse.
# A failure here means the bot and the integration have most likely stopped working.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live LOE API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run --locked pytest tests/test_live_api.py -v
        env:
          LOE_LIVE: "1"
