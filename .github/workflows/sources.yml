name: Sources

# Every few hours: query each operator's sources from GitHub's runners (abroad). Once a day,
# and on every push to main, also run the detailed live tests, address lookups included. A red
# run means an operator that should work has no working source; sites that answer only
# Ukrainian connections are not queried from here. The README's badges come from the Telegram
# bot, which runs the same check from Ukraine every hour (fastiuk/ukraine-energy-monitor-status).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"  # status badges
    - cron: "47 5 * * *"    # detailed live tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  status:
    name: Source status
    if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *'
    runs-on: ubuntu-latest
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - id: check
        run: |
          if uv run --locked python scripts/source_status.py --out status; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status
          path: status/
          retention-days: 7

  verdict:
    name: Every source works
    needs: status
    if: always() && needs.status.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.status.outputs.healthy }}" = "true"

  live:
    name: Live tests
    if: github.event_name != 'schedule' || github.event.schedule == '47 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run --locked pytest tests/test_live.py -v
        env:
          LIVE: "1"
