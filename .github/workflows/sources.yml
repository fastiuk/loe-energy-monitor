name: Sources

# Every few hours: query each operator's sources and publish a status badge per operator
# (README, section "Статус джерел") to the `status` branch. Once a day, and on every push to
# main, also run the detailed live tests, address lookups included. A red run means an
# operator that should work has no working source; sites that answer only Ukrainian
# connections are not queried from GitHub's runners.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"  # status badges
    - cron: "47 5 * * *"    # detailed live tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  status:
    name: Source status
    if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *'
    runs-on: ubuntu-latest
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - id: check
        run: |
          if uv run --locked python scripts/source_status.py --out status; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status
          path: status/
          retention-days: 7

  publish:
    name: Publish badges
    needs: status
    if: needs.status.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only for the force-push of the status branch below
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status
          path: status
      - name: Push the status branch
        working-directory: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b status
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Source status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status

  verdict:
    name: Every source works
    needs: [status, publish]
    if: always() && needs.status.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.status.outputs.healthy }}" = "true"

  live:
    name: Live tests
    if: github.event_name != 'schedule' || github.event.schedule == '47 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run --locked pytest tests/test_live.py -v
        env:
          LIVE: "1"
