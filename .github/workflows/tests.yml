name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core-bot:
    name: Core and bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run --locked pytest

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      # Home Assistant needs Python 3.14 and pins its own dependency versions,
      # so its tests run in a separate environment without the bot.
      - run: >-
          uv run --isolated --no-project --python 3.14
          --with pytest-homeassistant-custom-component==0.13.373
          pytest tests/ha -o asyncio_mode=auto
