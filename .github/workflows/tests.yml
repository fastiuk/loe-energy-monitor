name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run --locked pytest

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      # Home Assistant needs Python 3.14 and pins its own dependency versions,
      # so its tests run in a separate environment without the bot.
      - run: >-
          uv run --isolated --no-project --python 3.14
          --with pytest-homeassistant-custom-component==0.13.373
          pytest tests/ha -o asyncio_mode=auto

  home-assistant-latest:
    name: Home Assistant integration (latest HA)
    # Daily only: tells when a new Home Assistant release breaks the integration,
    # without blocking pushes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: >-
          uv run --isolated --no-project --python 3.14
          --refresh-package pytest-homeassistant-custom-component
          --with pytest-homeassistant-custom-component
          pytest tests/ha -o asyncio_mode=auto
