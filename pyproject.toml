[project]
name = "ukraine-energy-monitor"
version = "0.4.6"
description = "Графіки погодинних відключень світла для всіх областей України: джерела, розбір, Home Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "certifi>=2026.10.19",
    "pillow>=11",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ua_outages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["tests/ha"]
