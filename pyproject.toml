[project]
name = "loe-energy-monitor"
version = "0.2.0"
description = "Графіки погодинних відключень Львівобленерго: завантаження, розбір і порівняння версій"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loe_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
